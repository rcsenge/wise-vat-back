<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>vatback - Employee Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/vendor/neptune/props/custom-media.css" />
    <link rel="stylesheet" href="/vendor/neptune/props/neptune-tokens.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="bg-surface-screen text-ink-primary font-sans antialiased">
    <main
      class="mx-auto min-h-dvh w-full max-w-md px-4 pb-36 pt-[max(1.5rem,env(safe-area-inset-top))]"
    >
      <header class="flex items-center gap-3">
        <span
          class="bg-surface-neutral grid h-12 w-12 place-items-center rounded-full text-lg font-semibold"
          aria-hidden="true"
          >V</span
        >
        <p class="text-base font-semibold">vatback</p>
      </header>

      <h1 class="text-title-screen text-ink-primary mt-8 font-bold">
        Receipts
      </h1>

      <section aria-label="Claim summary" class="mt-6">
        <p class="text-ink-secondary text-lg">VAT you can claim</p>
        <p
          id="summary-claimable"
          class="text-amount-large mt-1 font-bold tabular-nums tracking-tight"
        >
          €0.00
        </p>
      </section>

      <p
        id="backend-error"
        class="bg-status-negative-background text-status-negative mt-6 hidden rounded-2xl p-4 text-sm"
      ></p>

      <section aria-labelledby="receipts-heading" class="mt-10">
        <h2
          id="receipts-heading"
          class="text-title-section text-ink-primary font-bold"
        >
          Transactions
        </h2>
        <ul id="receipt-list" class="mt-2 list-none pl-0"></ul>
      </section>

      <section
        id="empty-state"
        class="mt-6 flex flex-col items-center text-center"
      >
        <span
          class="bg-brand-bright-green text-brand-forest-green grid h-20 w-20 place-items-center rounded-full"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-9 w-9"
          >
            <path
              d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"
            />
            <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
            <path d="M12 17.5v-11" />
          </svg>
        </span>
        <h3
          class="font-display text-display-medium text-ink-primary mt-8 font-black uppercase"
        >
          Scan it,<br />claim it back
        </h3>
        <p class="text-ink-secondary mt-4 max-w-xs text-lg">
          Add your first company receipt. We check the VAT for you.
        </p>
      </section>

      <p class="text-ink-tertiary mt-10 text-center text-sm">
        <a
          href="/employer"
          class="text-brand-forest-green underline-offset-3 text-base font-semibold underline"
          >Open employer review</a
        >
      </p>
    </main>

    <div
      class="bg-surface-screen/95 fixed inset-x-0 bottom-0 px-4 pb-[max(1rem,env(safe-area-inset-bottom))] pt-4 backdrop-blur"
    >
      <div class="mx-auto max-w-md">
        <button
          type="button"
          id="upload-button"
          class="bg-brand-bright-green text-brand-forest-green ease-standard hover:bg-brand-bright-green-pressed active:scale-97 flex h-14 w-full cursor-pointer items-center justify-center gap-2 rounded-full px-6 text-lg font-semibold transition duration-150"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-5 w-5"
            aria-hidden="true"
          >
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
          Add document
        </button>
      </div>
    </div>

    <dialog
      id="upload-dialog"
      aria-labelledby="upload-dialog-title"
      class="rounded-t-4xl bg-surface-screen text-ink-primary shadow-sheet backdrop:bg-surface-overlay mx-auto mb-0 mt-auto max-h-[90dvh] w-full max-w-md px-4 pb-[max(1rem,env(safe-area-inset-bottom))] pt-2"
    >
      <div
        class="bg-line-neutral mx-auto mb-6 h-1 w-9 rounded-full"
        aria-hidden="true"
      ></div>
      <h2
        id="upload-dialog-title"
        class="text-title-section text-ink-primary font-bold"
      >
        Add document
      </h2>
      <p class="text-ink-secondary mt-2 text-base">
        Select the invoice file. A photo is optional.
      </p>
      <form id="upload-form" class="mt-6 space-y-4">
        <div>
          <label
            for="invoice-input"
            class="text-ink-secondary mb-2 block text-sm font-medium"
          >
            Invoice JSON
          </label>
          <input
            id="invoice-input"
            type="file"
            accept=".json,application/json"
            required
            class="border-line-neutral bg-surface-screen file:bg-surface-neutral focus:outline-brand-forest-green w-full rounded-2xl border p-4 text-base file:mr-3 file:rounded-full file:border-0 file:px-4 file:py-2 file:font-semibold focus:outline-2"
          />
        </div>
        <div>
          <label
            for="photo-input"
            class="text-ink-secondary mb-2 block text-sm font-medium"
          >
            Receipt photo
          </label>
          <input
            id="photo-input"
            type="file"
            accept="image/*"
            capture="environment"
            class="border-line-neutral bg-surface-screen file:bg-surface-neutral focus:outline-brand-forest-green w-full rounded-2xl border p-4 text-base file:mr-3 file:rounded-full file:border-0 file:px-4 file:py-2 file:font-semibold focus:outline-2"
          />
        </div>
        <img
          id="photo-preview"
          alt="Receipt preview"
          class="bg-surface-neutral hidden h-36 w-full rounded-3xl object-cover"
        />
        <div id="upload-result" class="hidden">
          <p id="upload-result-title" class="font-semibold"></p>
          <ul
            id="upload-result-reasons"
            class="mt-2 list-disc space-y-1 pl-5 text-sm"
          ></ul>
        </div>
        <div class="flex flex-col gap-3 pt-2">
          <button
            type="submit"
            id="submit-button"
            class="bg-brand-bright-green text-brand-forest-green ease-standard hover:bg-brand-bright-green-pressed active:scale-97 h-14 w-full cursor-pointer rounded-full px-6 text-lg font-semibold transition duration-150 disabled:opacity-40"
          >
            Check invoice
          </button>
          <button
            type="button"
            id="close-button"
            class="bg-surface-neutral text-ink-primary ease-standard hover:bg-surface-neutral-pressed active:scale-97 h-14 w-full cursor-pointer rounded-full px-6 text-lg font-semibold transition duration-150"
          >
            Close
          </button>
        </div>
      </form>
    </dialog>

    <dialog
      id="document-dialog"
      class="bg-surface-screen shadow-sheet backdrop:bg-surface-overlay m-auto w-[calc(100%-2rem)] max-w-md rounded-3xl p-3"
    >
      <img
        id="document-image"
        alt="Scanned receipt"
        class="max-h-[75dvh] w-full rounded-2xl object-contain"
      />
    </dialog>

    <script src="/api.js"></script>
    <script src="/receipts.js"></script>
    <script>
      (() => {
        "use strict";

        const MAX_IMAGE_DIMENSION = 800;
        const JPEG_QUALITY = 0.7;
        const RESULT_APPROVED_CLASS =
          "rounded-2xl bg-status-positive-background p-4 text-base text-brand-forest-green";
        const RESULT_REJECTED_CLASS =
          "rounded-2xl bg-status-negative-background p-4 text-base text-status-negative";

        const api = window.vatbackApi;
        const receipts = window.vatbackReceipts.create({ approvedOnly: false });

        const uploadButton = document.getElementById("upload-button");
        const uploadDialog = document.getElementById("upload-dialog");
        const uploadForm = document.getElementById("upload-form");
        const invoiceInput = document.getElementById("invoice-input");
        const photoInput = document.getElementById("photo-input");
        const photoPreview = document.getElementById("photo-preview");
        const uploadResult = document.getElementById("upload-result");
        const uploadResultTitle = document.getElementById(
          "upload-result-title",
        );
        const uploadResultReasons = document.getElementById(
          "upload-result-reasons",
        );
        const submitButton = document.getElementById("submit-button");
        const closeButton = document.getElementById("close-button");

        let photoDataUrl = null;

        const downscaleImage = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
              const image = new Image();
              image.onload = () => {
                const scale = Math.min(
                  1,
                  MAX_IMAGE_DIMENSION / Math.max(image.width, image.height),
                );
                const width = Math.max(1, Math.round(image.width * scale));
                const height = Math.max(1, Math.round(image.height * scale));
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                canvas.getContext("2d").drawImage(image, 0, 0, width, height);
                resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
              };
              image.onerror = reject;
              image.src = reader.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        };

        const showResult = (approved, title, reasons) => {
          uploadResult.className = approved
            ? RESULT_APPROVED_CLASS
            : RESULT_REJECTED_CLASS;
          uploadResultTitle.textContent = title;
          uploadResultReasons.replaceChildren(
            ...reasons.map((reason) => {
              const item = document.createElement("li");
              item.textContent = reason;
              return item;
            }),
          );
        };

        const describeResult = (result) => {
          if (result.status !== "approved") {
            return "Rejected.";
          }
          const totals = api.sumByCurrency(
            result.country_totals,
            (total) => total.refundable_vat_total,
          );
          return `Approved. Refundable VAT: ${api.formatTotals(totals)}`;
        };

        uploadButton.addEventListener("click", () => {
          uploadForm.reset();
          photoDataUrl = null;
          photoPreview.classList.add("hidden");
          uploadResult.className = "hidden";
          submitButton.disabled = false;
          uploadDialog.showModal();
        });

        photoInput.addEventListener("change", async () => {
          const file = photoInput.files[0];
          photoDataUrl = null;
          photoPreview.classList.add("hidden");
          if (!file || !file.type.startsWith("image/")) {
            return;
          }
          photoDataUrl = await downscaleImage(file);
          photoPreview.src = photoDataUrl;
          photoPreview.classList.remove("hidden");
        });

        uploadForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const invoiceFile = invoiceInput.files[0];
          if (!invoiceFile) {
            showResult(false, "Select a file.", [
              "The invoice JSON is required.",
            ]);
            return;
          }
          submitButton.disabled = true;
          try {
            const result = await api.uploadInvoice(invoiceFile, photoDataUrl);
            showResult(
              result.status === "approved",
              describeResult(result),
              result.reasons,
            );
            await receipts.refresh();
          } catch (error) {
            showResult(false, "Upload failed.", error.reasons);
          } finally {
            submitButton.disabled = false;
          }
        });

        closeButton.addEventListener("click", () => {
          uploadDialog.close();
        });

        receipts.refresh();
      })();
    </script>
  </body>
</html>
