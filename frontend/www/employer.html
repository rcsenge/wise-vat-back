<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <title>SIGINT - Employer Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css"
    />
    <link rel="stylesheet" href="vendor/neptune/props/custom-media.css" />
    <link rel="stylesheet" href="vendor/neptune/props/neptune-tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-surface-screen text-ink-primary font-sans antialiased">
    <main
      class="mx-auto min-h-dvh w-full max-w-6xl px-4 pb-16 pt-[max(1.5rem,env(safe-area-inset-top))] sm:px-6 lg:px-8 lg:pt-10"
    >
      <header class="flex items-center gap-3">
        <span
          class="bg-surface-neutral grid h-12 w-12 place-items-center rounded-full text-lg font-semibold"
          aria-hidden="true"
          >S</span
        >
        <p class="text-base font-semibold">SIGINT</p>
        <a
          href="/employee"
          class="text-brand-forest-green underline-offset-3 ml-auto text-base font-semibold underline"
          >Employee app</a
        >
      </header>

      <div
        class="mt-8 lg:mt-10 lg:grid lg:grid-cols-[minmax(0,7fr)_minmax(0,5fr)] lg:gap-8 xl:gap-12"
      >
        <div>
          <h1 class="text-title-screen text-ink-primary font-bold">VAT back</h1>

          <section
            aria-label="Total refundable VAT"
            class="bg-brand-forest-green mt-6 rounded-3xl p-6 sm:p-8"
          >
            <p class="text-brand-light-green text-base font-medium">
              Total refundable VAT
            </p>
            <div id="hero-totals" class="mt-3"></div>
            <p
              id="hero-meta"
              class="text-brand-light-green mt-5 text-sm font-medium"
            ></p>
          </section>

          <p
            id="backend-error"
            class="bg-status-negative-background text-status-negative mt-6 hidden rounded-2xl p-4 text-sm"
          ></p>

          <section aria-labelledby="countries-heading" class="mt-10">
            <h2
              id="countries-heading"
              class="text-title-section text-ink-primary font-bold"
            >
              By country
            </h2>
            <ul id="country-list" class="mt-4 list-none space-y-3 pl-0"></ul>
          </section>
        </div>

        <aside
          aria-labelledby="receipts-heading"
          class="border-line-neutral max-lg:hidden lg:sticky lg:top-10 lg:max-h-[calc(100dvh-5rem)] lg:self-start lg:overflow-y-auto lg:rounded-3xl lg:border lg:p-6"
        >
          <div class="flex items-center gap-3">
            <h2
              id="receipts-heading"
              class="text-title-section text-ink-primary font-bold"
            >
              Receipts
            </h2>
            <button
              type="button"
              id="filter-chip"
              class="bg-brand-light-green text-brand-forest-green hover:bg-brand-light-green-pressed ml-auto inline-flex h-10 cursor-pointer items-center gap-2 rounded-full px-4 text-base font-semibold transition"
            ></button>
            <p
              id="filter-all"
              class="text-ink-tertiary ml-auto text-sm font-medium"
            >
              All countries
            </p>
          </div>
          <ul id="receipt-list" class="mt-2 list-none pl-0"></ul>
          <p id="empty-state" class="text-ink-secondary mt-4 text-base">
            No approved receipts yet.
          </p>
        </aside>
      </div>
    </main>

    <dialog
      id="document-dialog"
      class="bg-surface-screen shadow-sheet backdrop:bg-surface-overlay m-auto w-[calc(100%-2rem)] max-w-lg rounded-3xl p-3"
    >
      <img
        id="document-image"
        alt="Scanned receipt"
        class="max-h-[75dvh] w-full rounded-2xl object-contain"
      />
    </dialog>

    <script src="api.js"></script>
    <script src="receipts.js"></script>
    <script>
      (() => {
        "use strict";

        const REFRESH_INTERVAL_MS = 5000;
        const COUNTRY_CODE_PATTERN = /^[A-Z]{2}$/;

        const api = window.vatbackApi;
        const regionNames = new Intl.DisplayNames(["en"], { type: "region" });
        const heroTotals = document.getElementById("hero-totals");
        const heroMeta = document.getElementById("hero-meta");
        const countryList = document.getElementById("country-list");
        const filterChip = document.getElementById("filter-chip");
        const filterAll = document.getElementById("filter-all");

        let countryTotals = [];
        let expiredTotals = [];
        let periods = [];
        let referenceDate = null;
        let ratesTable = null;
        let approvedReceipts = [];
        let selectedCountry = null;
        let renderedState = "";

        const element = (tag, className, text) => {
          const node = document.createElement(tag);
          node.className = className;
          if (text !== undefined) {
            node.textContent = text;
          }
          return node;
        };

        const countryName = (code) =>
          COUNTRY_CODE_PATTERN.test(code) ? regionNames.of(code) : code;

        const receiptsOf = (code) =>
          approvedReceipts.filter((receipt) => receipt.country === code);

        const claimableCount = (receipts) =>
          receipts.filter((receipt) => !receipt.expired).length;

        const DAY_MS = 86400000;
        const WARNING_DAYS = 90;
        const URGENT_DAYS = 30;
        // Tailwind builds only the classes it finds in the source. The list names every bar width.
        const BAR_WIDTHS = [
          "w-0",
          "w-[5%]",
          "w-[10%]",
          "w-[15%]",
          "w-[20%]",
          "w-[25%]",
          "w-[30%]",
          "w-[35%]",
          "w-[40%]",
          "w-[45%]",
          "w-[50%]",
          "w-[55%]",
          "w-[60%]",
          "w-[65%]",
          "w-[70%]",
          "w-[75%]",
          "w-[80%]",
          "w-[85%]",
          "w-[90%]",
          "w-[95%]",
          "w-full",
        ];

        const dayNumber = (isoDate) =>
          Date.parse(`${isoDate}T00:00:00Z`) / DAY_MS;

        // The open refund periods of a country, oldest year first.
        const periodsOf = (total) =>
          periods
            .filter(
              (period) =>
                period.country === total.country &&
                period.currency === total.currency,
            )
            .sort((first, second) => first.year - second.year);

        // The bar fills from 1 January of the year to the claim deadline.
        const createDeadlineBar = (period, trackClass) => {
          const start = dayNumber(period.period_start);
          const end = dayNumber(period.claim_deadline);
          const today = dayNumber(referenceDate ?? period.period_start);
          const daysLeft = Math.max(0, Math.round(end - today));
          const share = Math.min(
            1,
            Math.max(0, (today - start) / (end - start)),
          );
          const widthClass =
            BAR_WIDTHS[Math.round(share * (BAR_WIDTHS.length - 1))];
          const colorClass =
            daysLeft <= URGENT_DAYS
              ? "bg-status-negative"
              : daysLeft <= WARNING_DAYS
                ? "bg-amber-400"
                : "bg-brand-bright-green";

          const track = element(
            "div",
            `${trackClass} mt-2 h-2 w-full overflow-hidden rounded-full`,
          );
          track.setAttribute("role", "progressbar");
          track.setAttribute(
            "aria-label",
            `Time used until the ${period.year} claim deadline`,
          );
          track.setAttribute("aria-valuemin", "0");
          track.setAttribute("aria-valuemax", "100");
          track.setAttribute("aria-valuenow", String(Math.round(share * 100)));
          track.append(
            element("div", `h-full rounded-full ${widthClass} ${colorClass}`),
          );
          return { track, daysLeft };
        };

        // Every country shares the claim deadline of a year. The hero shows it once.
        const createPeriodRow = (period) => {
          const row = element("div", "bg-surface-screen rounded-2xl p-4");

          const header = element(
            "div",
            "flex items-start justify-between gap-3",
          );
          header.append(
            element(
              "p",
              "text-ink-primary min-w-0 text-base font-semibold",
              `${period.year} claim · ${period.invoice_count} invoice${period.invoice_count === 1 ? "" : "s"}`,
            ),
            element(
              "p",
              "text-ink-primary shrink-0 text-base font-bold tabular-nums",
              api.formatMoney(period.refundable_vat_total, period.currency),
            ),
          );

          const download = element(
            "a",
            "bg-brand-bright-green text-brand-forest-green hover:bg-brand-bright-green-pressed mt-4 inline-flex h-10 items-center gap-2 rounded-full px-4 text-sm font-semibold transition",
            "Generate package",
          );
          download.href = api.packageUrl(period.country, period.year);
          download.setAttribute(
            "aria-label",
            `Generate the ${period.year} claim package for the accountant`,
          );
          download.setAttribute("download", "");

          row.append(header, download);
          return row;
        };

        const createFlag = (code) => {
          const flag = element(
            "span",
            "fi fis shrink-0 rounded-full text-[40px] ring-1 ring-black/5 sm:text-[48px]",
          );
          if (COUNTRY_CODE_PATTERN.test(code)) {
            flag.classList.add(`fi-${code.toLowerCase()}`);
          }
          flag.setAttribute("aria-hidden", "true");
          return flag;
        };

        const chevronIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>`;

        const createCountryCard = (total) => {
          const isSelected = total.country === selectedCountry;
          const receiptCount = claimableCount(receiptsOf(total.country));
          const listId = `country-receipts-${total.country}`;

          const item = element(
            "li",
            isSelected
              ? "bg-surface-neutral-pressed ring-brand-forest-green rounded-3xl ring-2"
              : "bg-surface-neutral rounded-3xl",
          );
          const button = element(
            "button",
            "focus-visible:ring-brand-forest-green flex w-full cursor-pointer items-center gap-3 rounded-3xl p-4 text-left focus:outline-none focus-visible:ring-2 sm:gap-4 sm:p-5",
          );
          button.type = "button";
          button.setAttribute("aria-expanded", String(isSelected));
          button.setAttribute("aria-controls", listId);
          button.addEventListener("click", () => selectCountry(total.country));

          const label = element("span", "min-w-0 flex-1");
          label.append(
            element(
              "span",
              "text-ink-primary block truncate text-base font-semibold sm:text-xl",
              countryName(total.country),
            ),
            element(
              "span",
              "text-ink-secondary block whitespace-nowrap text-sm",
              `${receiptCount} receipt${receiptCount === 1 ? "" : "s"}`,
            ),
          );

          const amount = element("span", "shrink-0 text-right tabular-nums");
          amount.append(
            element(
              "span",
              "text-ink-primary block text-lg font-bold tracking-tight sm:text-2xl lg:text-[28px]",
              api.formatMoney(total.refundable_vat_total, total.currency),
            ),
            element(
              "span",
              "text-ink-tertiary block text-xs font-semibold",
              total.currency,
            ),
          );

          const chevron = element(
            "span",
            isSelected
              ? "text-ink-primary rotate-180 transition-transform lg:hidden"
              : "text-ink-primary transition-transform lg:hidden",
          );
          chevron.innerHTML = chevronIcon;

          button.append(createFlag(total.country), label, amount, chevron);

          const receiptList = element(
            "ul",
            isSelected
              ? "list-none px-4 pb-2 pl-4 sm:px-5 lg:hidden"
              : "hidden list-none pl-0",
          );
          receiptList.id = listId;
          receiptList.append(
            ...receiptsOf(total.country).map(window.vatbackReceipts.createItem),
          );

          const periodList = element(
            "div",
            "space-y-3 px-4 pb-4 sm:px-5 sm:pb-5",
          );
          periodList.append(...periodsOf(total).map(createPeriodRow));

          item.append(button, periodList, receiptList);
          return item;
        };

        const GENERATE_ALL_LABEL = "Generate all";
        // The browser starts each download after a short pause. It then keeps every file.
        const PACKAGE_DOWNLOAD_PAUSE_MS = 800;
        let isGeneratingAll = false;

        const generateAllButton = element(
          "button",
          "bg-brand-bright-green text-brand-forest-green hover:bg-brand-bright-green-pressed mt-4 inline-flex h-12 cursor-pointer items-center rounded-full px-6 text-base font-semibold transition disabled:cursor-not-allowed disabled:opacity-50",
          GENERATE_ALL_LABEL,
        );
        generateAllButton.type = "button";
        generateAllButton.setAttribute(
          "aria-label",
          "Generate the claim package of every open period in every country",
        );

        const downloadPackage = (period) => {
          const link = document.createElement("a");
          link.href = api.packageUrl(period.country, period.year);
          link.setAttribute("download", "");
          link.click();
        };

        // The loop runs once per open period. The period list bounds it.
        const generateAll = async () => {
          const openPeriods = [...periods].sort(
            (first, second) =>
              first.country.localeCompare(second.country) ||
              first.year - second.year,
          );
          isGeneratingAll = true;
          generateAllButton.disabled = true;
          for (const [index, period] of openPeriods.entries()) {
            generateAllButton.textContent = `Generating ${index + 1} of ${openPeriods.length}…`;
            downloadPackage(period);
            await new Promise((resolve) =>
              setTimeout(resolve, PACKAGE_DOWNLOAD_PAUSE_MS),
            );
          }
          isGeneratingAll = false;
          generateAllButton.textContent = GENERATE_ALL_LABEL;
          generateAllButton.disabled = periods.length === 0;
        };

        generateAllButton.addEventListener("click", generateAll);

        // The hero shows one total in EUR. The demo rate table converts every other currency.
        const HERO_CURRENCY = "EUR";

        const toHeroCurrency = (totals) => {
          let amount = 0;
          let converted = false;
          totals.forEach((total) => {
            const value = Number(total.refundable_vat_total);
            if (total.currency === HERO_CURRENCY) {
              amount += value;
              return;
            }
            const rate = Number(ratesTable?.rates?.[total.currency]);
            if (!Number.isFinite(rate) || rate <= 0) {
              return;
            }
            amount += value / rate;
            converted = true;
          });
          return { amount, converted };
        };

        // One deadline row per open year. The first period of a year gives the dates.
        const createHeroDeadlines = () => {
          const periodByYear = new Map();
          periods.forEach((period) => {
            if (!periodByYear.has(period.year)) {
              periodByYear.set(period.year, period);
            }
          });
          return [...periodByYear.values()]
            .sort((first, second) => first.year - second.year)
            .map((period) => {
              const { track, daysLeft } = createDeadlineBar(
                period,
                "bg-white/15",
              );
              const row = element("div", "mt-5");
              row.append(
                element(
                  "p",
                  "text-brand-light-green text-sm font-medium",
                  `${period.year} invoices · Claim by ${window.vatbackReceipts.formatDay(period.claim_deadline)} · ${daysLeft} days left`,
                ),
                track,
              );
              return row;
            });
        };

        const renderHero = () => {
          const open = toHeroCurrency(countryTotals);
          generateAllButton.disabled = isGeneratingAll || periods.length === 0;
          const children = [
            element(
              "p",
              "font-display text-display-large text-brand-bright-green tabular-nums sm:text-[64px]",
              `${open.converted ? "≈ " : ""}${api.formatMoney(open.amount, HERO_CURRENCY)}`,
            ),
          ];
          children.push(generateAllButton, ...createHeroDeadlines());
          heroTotals.replaceChildren(...children);
          const countryCount = new Set(
            countryTotals.map((total) => total.country),
          ).size;
          const expired = toHeroCurrency(expiredTotals);
          const expiredText = expiredTotals.length
            ? ` · ${expired.converted ? "≈ " : ""}${api.formatMoney(expired.amount, HERO_CURRENCY)} lost after the deadline`
            : "";
          heroMeta.textContent = `${claimableCount(approvedReceipts)} approved receipts · ${countryCount} countries${expiredText}`;
        };

        const renderFilter = () => {
          filterChip.classList.toggle("hidden", !selectedCountry);
          filterAll.classList.toggle("hidden", Boolean(selectedCountry));
          filterChip.textContent = selectedCountry
            ? `${countryName(selectedCountry)} ×`
            : "";
        };

        // The page refreshes often. It redraws only when the data changes.
        const render = () => {
          const state = JSON.stringify([
            countryTotals,
            expiredTotals,
            periods,
            referenceDate,
            ratesTable,
            approvedReceipts.map((receipt) => receipt.id),
            selectedCountry,
          ]);
          if (state === renderedState) {
            return;
          }
          renderedState = state;
          renderHero();
          renderFilter();
          const sorted = [...countryTotals].sort((first, second) =>
            countryName(first.country).localeCompare(
              countryName(second.country),
            ),
          );
          countryList.replaceChildren(...sorted.map(createCountryCard));
        };

        const receipts = window.vatbackReceipts.create({
          approvedOnly: true,
          onRender: (approved) => {
            approvedReceipts = approved;
            render();
          },
        });

        const selectCountry = (code) => {
          selectedCountry = selectedCountry === code ? null : code;
          receipts.setCountry(selectedCountry);
        };

        filterChip.addEventListener("click", () => selectCountry(null));

        const refreshClaims = async () => {
          try {
            const claims = await api.getClaims();
            countryTotals = claims.per_country;
            expiredTotals = claims.expired_per_country ?? [];
            periods = claims.periods ?? [];
            referenceDate = claims.reference_date ?? null;
            ratesTable =
              ratesTable ?? (await api.getRatesTable().catch(() => null));
            render();
          } catch (error) {
            countryTotals = [];
            expiredTotals = [];
            periods = [];
            referenceDate = null;
            render();
          }
        };

        const refresh = () => {
          receipts.refresh();
          refreshClaims();
        };

        refresh();
        setInterval(refresh, REFRESH_INTERVAL_MS);
      })();
    </script>
  </body>
</html>
