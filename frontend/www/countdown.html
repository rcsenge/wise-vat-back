<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f2600" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>vatback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="vendor/neptune/props/neptune-tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="bg-brand-forest-green-dark text-brand-bright-green font-sans antialiased lg:overflow-hidden"
  >
    <progress
      id="countdown-progress"
      class="bg-brand-light-green/15 [&::-moz-progress-bar]:bg-brand-bright-green [&::-webkit-progress-bar]:bg-brand-light-green/15 [&::-webkit-progress-value]:bg-brand-bright-green fixed left-0 top-0 z-10 h-1.5 w-full appearance-none"
      max="300"
      value="0"
      aria-label="Progress"
    ></progress>

    <svg
      class="pointer-events-none fixed inset-x-0 top-1/2 w-full -translate-y-1/2 select-none"
      viewBox="0 0 1000 254"
      aria-hidden="true"
    >
      <text
        class="fill-brand-forest-green font-display"
        x="0"
        y="227"
        font-size="318"
        textLength="1000"
        lengthAdjust="spacingAndGlyphs"
      >
        SIGINT
      </text>
    </svg>

    <main
      class="relative grid min-h-dvh w-full grid-rows-[auto_1fr] lg:h-dvh lg:grid-cols-[minmax(0,1fr)_minmax(0,1.1fr)] lg:grid-rows-1"
    >
      <div
        class="aspect-square w-full lg:order-2 lg:aspect-auto lg:h-full"
        aria-hidden="true"
      >
        <canvas id="countdown-globe" class="block h-full w-full"></canvas>
      </div>

      <section
        class="flex flex-col justify-center px-4 pb-10 sm:px-8 lg:order-1 lg:pb-0 lg:pl-[7vw] lg:pr-0"
      >
        <p
          id="countdown-timer"
          class="bg-brand-bright-green text-brand-forest-green flex h-14 items-center self-start rounded-full px-7 text-2xl font-semibold tabular-nums lg:h-16 lg:px-8 lg:text-3xl"
          role="timer"
          aria-label="Timer"
        >
          05:00
        </p>
        <p
          id="countdown-amount"
          class="font-display mt-8 text-[22vw] font-black tabular-nums leading-[0.85] tracking-[-0.02em] lg:mt-12 lg:text-[9.5vw]"
        >
          0
        </p>
        <p
          class="text-brand-light-green mt-4 text-2xl font-semibold lg:mt-6 lg:text-3xl"
        >
          EUR
        </p>

        <div class="mt-10 flex gap-3 lg:mt-16">
          <button
            id="countdown-button-start"
            type="button"
            class="bg-brand-bright-green text-brand-forest-green active:bg-brand-bright-green-pressed disabled:bg-brand-light-green/15 disabled:text-brand-light-green h-14 rounded-full px-10 text-lg font-semibold"
          >
            Start
          </button>
          <button
            id="countdown-button-reset"
            type="button"
            class="bg-brand-light-green text-brand-forest-green active:bg-brand-light-green-pressed h-14 rounded-full px-10 text-lg font-semibold"
          >
            Reset
          </button>
        </div>
      </section>
    </main>
    <script src="countdown.js"></script>
    <script src="vendor/globe/topojson-client.min.js"></script>
    <script type="module" src="globe.js"></script>
  </body>
</html>
