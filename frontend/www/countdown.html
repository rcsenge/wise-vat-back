<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>vatback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="vendor/neptune/props/neptune-tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-surface-screen text-ink-primary font-sans antialiased">
    <main
      class="mx-auto flex min-h-dvh w-full max-w-md flex-col px-4 pb-[max(1.5rem,env(safe-area-inset-bottom))] pt-[max(1rem,env(safe-area-inset-top))]"
    >
      <progress
        id="countdown-progress"
        class="bg-surface-neutral [&::-moz-progress-bar]:bg-brand-bright-green [&::-webkit-progress-bar]:bg-surface-neutral [&::-webkit-progress-value]:bg-brand-bright-green h-1 w-full appearance-none overflow-hidden rounded-full [&::-moz-progress-bar]:rounded-full [&::-webkit-progress-value]:rounded-full"
        max="300"
        value="0"
        aria-label="Progress"
      ></progress>

      <section
        class="flex flex-1 flex-col items-center justify-center text-center"
      >
        <p
          id="countdown-timer"
          class="bg-brand-light-green text-brand-forest-green flex h-12 items-center rounded-full px-6 text-xl font-semibold tabular-nums"
          role="timer"
          aria-label="Timer"
        >
          05:00
        </p>
        <p
          id="countdown-amount"
          class="font-display mt-10 text-[80px] font-black tabular-nums leading-[0.85] tracking-[-0.015em]"
        >
          0
        </p>
        <p class="text-ink-secondary mt-4 text-lg font-semibold">EUR</p>
      </section>

      <div class="flex flex-col gap-3">
        <button
          id="countdown-button-start"
          type="button"
          class="bg-brand-bright-green text-brand-forest-green active:bg-brand-bright-green-pressed disabled:bg-surface-neutral disabled:text-ink-tertiary h-14 w-full rounded-full text-lg font-semibold"
        >
          Start
        </button>
        <button
          id="countdown-button-reset"
          type="button"
          class="bg-brand-light-green text-brand-forest-green active:bg-brand-light-green-pressed h-14 w-full rounded-full text-lg font-semibold"
        >
          Reset
        </button>
      </div>
    </main>
    <script src="countdown.js"></script>
  </body>
</html>
