<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#00a4a6" />
    <title>vatback - Employee Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="bg-[#f5f7fa] font-[Inter,ui-sans-serif,system-ui,sans-serif] text-[#163300] antialiased"
  >
    <main class="mx-auto flex min-h-dvh w-full max-w-md flex-col">
      <header
        class="sticky top-0 z-10 border-b border-[#e6e9ea] bg-white px-4 pt-[max(1rem,env(safe-area-inset-top))] pb-4"
      >
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span
              class="grid h-10 w-10 place-items-center rounded-2xl bg-[#00a4a6] text-white"
              aria-hidden="true"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="h-5 w-5"
              >
                <path d="M17 2l4 4-4 4" />
                <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                <path d="M7 22l-4-4 4-4" />
                <path d="M21 13v2a4 4 0 0 1-4 4H3" />
              </svg>
            </span>
            <div>
              <h1 class="text-lg leading-tight font-semibold tracking-tight">
                vatback
              </h1>
              <p class="text-xs text-[#6b7a78]">Money without borders</p>
            </div>
          </div>
          <span
            id="receipt-count"
            class="rounded-full bg-[#00a4a6]/10 px-3 py-1 text-sm font-semibold text-[#00a4a6]"
          >
            0
          </span>
        </div>
      </header>

      <section aria-labelledby="scan-heading" class="flex-1 px-4 py-4">
        <h2 id="scan-heading" class="sr-only">Scanned receipts</h2>
        <ul id="receipt-list" class="space-y-3"></ul>
      </section>

      <section id="empty-state" class="px-4 pt-16 pb-12">
        <div class="mx-auto max-w-xs text-center">
          <div
            class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-[#00a4a6]/10 text-[#00a4a6]"
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="h-8 w-8"
            >
              <path
                d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"
              />
              <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
              <path d="M12 17.5v-11" />
            </svg>
          </div>
          <h2 class="mt-4 text-base font-semibold">No receipts yet</h2>
          <p class="mt-1 text-sm text-[#6b7a78]">
            Tap Add New Document to scan your first receipt.
          </p>
        </div>
      </section>

      <footer
        class="sticky bottom-0 z-10 border-t border-[#e6e9ea] bg-white/95 px-4 pt-3 pb-[max(1rem,env(safe-area-inset-bottom))] backdrop-blur"
      >
        <label
          for="document-input"
          class="block w-full cursor-pointer rounded-full bg-[#00a4a6] px-4 py-3.5 text-center text-base font-semibold text-white shadow-sm transition-colors hover:bg-[#009094]"
        >
          Add New Document
        </label>
        <input
          id="document-input"
          type="file"
          accept="image/*"
          capture="environment"
          class="sr-only"
        />
      </footer>
    </main>

    <script>
      (() => {
        "use strict";

        const STORAGE_KEY = "vatback-receipts";
        const MAX_RECEIPTS = 50;
        const MAX_IMAGE_DIMENSION = 800;
        const JPEG_QUALITY = 0.7;

        const receiptList = document.getElementById("receipt-list");
        const documentInput = document.getElementById("document-input");
        const receiptCount = document.getElementById("receipt-count");
        const emptyState = document.getElementById("empty-state");

        const readReceipts = () => {
          try {
            const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
            return Array.isArray(stored) ? stored : [];
          } catch (error) {
            return [];
          }
        };

        const saveReceipts = (receipts) => {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(receipts));
        };

        const createReceiptItem = (receipt) => {
          const item = document.createElement("li");
          item.className =
            "flex items-center gap-3 rounded-2xl border border-[#e6e9ea] bg-white p-4 shadow-sm";

          const image = document.createElement("img");
          image.src = receipt.imageDataUrl;
          image.alt = "Scanned receipt preview";
          image.className = "h-14 w-14 shrink-0 rounded-xl object-cover";

          const details = document.createElement("div");
          details.className = "min-w-0 flex-1";

          const name = document.createElement("p");
          name.className = "truncate text-sm font-medium";
          name.textContent = receipt.fileName;

          const time = document.createElement("p");
          time.className = "text-xs text-[#6b7a78]";
          time.textContent = new Date(receipt.scannedAt).toLocaleString();

          const status = document.createElement("span");
          status.className =
            "rounded-full bg-[#00a4a6]/10 px-3 py-1 text-xs font-semibold text-[#00a4a6]";
          status.textContent = "Pending";

          details.append(name, time);
          item.append(image, details, status);
          return item;
        };

        const render = () => {
          const receipts = readReceipts().slice(0, MAX_RECEIPTS);
          receiptList.replaceChildren();
          receipts.forEach((receipt) => {
            receiptList.appendChild(createReceiptItem(receipt));
          });
          const hasReceipts = receipts.length > 0;
          emptyState.classList.toggle("hidden", hasReceipts);
          receiptCount.textContent = String(receipts.length);
        };

        const downscaleImage = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
              const image = new Image();
              image.onload = () => {
                const scale = Math.min(
                  1,
                  MAX_IMAGE_DIMENSION / Math.max(image.width, image.height),
                );
                const width = Math.max(1, Math.round(image.width * scale));
                const height = Math.max(1, Math.round(image.height * scale));
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                canvas.getContext("2d").drawImage(image, 0, 0, width, height);
                resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
              };
              image.onerror = reject;
              image.src = reader.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        };

        documentInput.addEventListener("change", async () => {
          const file = documentInput.files[0];
          documentInput.value = "";
          if (!file || !file.type.startsWith("image/")) {
            return;
          }
          const receipts = readReceipts();
          if (receipts.length >= MAX_RECEIPTS) {
            return;
          }
          const imageDataUrl = await downscaleImage(file);
          receipts.unshift({
            id: Date.now().toString(),
            fileName: file.name,
            scannedAt: Date.now(),
            imageDataUrl,
          });
          saveReceipts(receipts);
          render();
        });

        render();
      })();
    </script>
  </body>
</html>
